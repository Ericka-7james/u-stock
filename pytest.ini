# pytest.ini (repo root) — backend/api
[pytest]
minversion = 8.0

filterwarnings =
    ignore:The `gotrue` package is deprecated:DeprecationWarning

pythonpath = backend

testpaths =
    backend/api/tests
    backend/api/security/tests
    backend/api/routes/tests
    backend/api/core/tests
    backend/api/clients/tests
    backend/api/app/tests

addopts =
    -q
    --disable-warnings
    --cov=backend/api
    --cov-report=term-missing
    --cov-report=xml:coverage-backend.xml
    --cov-fail-under=70

markers =
    slow: marks tests as slow (deselect with -m "not slow")