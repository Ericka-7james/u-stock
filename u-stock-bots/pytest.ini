# u-stock-bots/pytest.ini
[pytest]
minversion = 8.0

filterwarnings =
    ignore:The `gotrue` package is deprecated:DeprecationWarning

pythonpath = .

testpaths =
    bots/_shared/tests
    bots/ema_trend/tests
    bots/execution/tests
    bots/logging/tests
    runner/tests

addopts =
    -q
    --disable-warnings
    --cov=bots
    --cov-report=term-missing
    --cov-fail-under=70
