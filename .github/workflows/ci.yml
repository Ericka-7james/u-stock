name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Frontend (Vitest)
      # -------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests (coverage)
        working-directory: frontend
        run: npm run test -- --coverage --run

      # -------------------------
      # Python setup
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            u-stock-bots/requirements.txt

      - name: Guard backend requirements for Vercel
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          req_file = Path("backend/requirements.txt")
          if not req_file.exists():
              print("Missing backend/requirements.txt")
              sys.exit(1)

          banned = {
              "yfinance",
              "pandas",
              "numpy",
              "pyarrow",
              "curl-cffi",
              "sseclient-py",
              "greenlet",
              "multitasking",
          }

          found = []

          for raw_line in req_file.read_text(encoding="utf-8").splitlines():
              line = raw_line.split("#", 1)[0].strip()
              if not line:
                  continue

              pkg = re.split(r"[<>=!~\[]", line, maxsplit=1)[0].strip().lower().replace("_", "-")
              if pkg in banned:
                  found.append(pkg)

          if found:
              for pkg in sorted(set(found)):
                  print(f"Banned backend dependency detected: {pkg}")
              sys.exit(1)

          print("Backend requirements passed Vercel bundle guard.")
          PY

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r u-stock-bots/requirements.txt
          pip install pytest pytest-cov

      # -------------------------
      # Backend tests
      # -------------------------
      - name: Backend tests (pytest + coverage)
        run: |
          python -m pytest -q backend/api \
          --cov=backend/api \
          --cov-report=xml:coverage-backend.xml \
          --cov-report=term-missing

      # -------------------------
      # Bots tests
      # -------------------------
      - name: Bots tests (pytest + coverage)
        run: |
          python -m pytest -q u-stock-bots \
          --cov=u-stock-bots \
          --cov-report=xml:u-stock-bots/coverage-bots.xml \
          --cov-report=term-missing

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload backend coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage-backend.xml

      - name: Upload bots coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: bots-coverage-xml
          path: u-stock-bots/coverage-bots.xml