name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Frontend (Vitest)
      # -------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests (coverage)
        working-directory: frontend
        run: npm run test -- --coverage

      # -------------------------
      # Backend (pytest)
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps (root)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest pytest-cov python-dotenv requests
          fi

      - name: Backend tests (pytest + coverage)
        run: pytest

      # -------------------------
      # Bots/runner (pytest)
      # -------------------------
      - name: Install bots deps
        run: |
          python -m pip install --upgrade pip
          if [ -f u-stock-bots/requirements.txt ]; then
            pip install -r u-stock-bots/requirements.txt
          else
            pip install pytest pytest-cov python-dotenv requests
          fi

      - name: Bots tests (pytest + coverage)
        working-directory: u-stock-bots
        run: pytest

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload backend coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage-backend.xml

      - name: Upload bots coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: bots-coverage-xml
          path: u-stock-bots/coverage-bots.xml