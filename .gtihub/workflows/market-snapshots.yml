name: Market Data Snapshots

on:
  schedule:
    # 9:30 AM ET market open (handles EST + EDT)
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yahooquery pandas pyarrow requests

      - name: Run fetchers (freshness skips work)
        env:
          MAX_PRICE_AGE_MINUTES: "1440"
          MAX_FUNDAMENTALS_AGE_MINUTES: "10080"
          MAX_INTRADAY_AGE_2M: "3"
          MAX_INTRADAY_AGE_5M: "10"
          MAX_INTRADAY_AGE_15M: "20"
          MAX_QUOTES_AGE_MINUTES: "60"
        run: |
          python -m data_scout.fetchers.fetch_prices
          python -m data_scout.fetchers.fetch_intraday
          python -m data_scout.fetchers.fetch_fundamentals
          python -m data_scout.fetchers.fetch_quotes

      - name: Upload snapshots to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          python -m data_scout.fetchers.upload_to_supabase
